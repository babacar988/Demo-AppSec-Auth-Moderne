
server:
  connection-timeout: 5000
  port: 8090
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    freemarker: INFO
    org.springframework.ui.freemarker: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.web: DEBUG

planets:
  service:
    url: http://localhost:8091/planets

spring:
  freemarker:
    cache: false

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://192.168.163.218:8080/realms/bzhcamp
            user-name-attribute: preferred_username

        registration:
          keycloak:
            provider: keycloak
            client-id: app-springboot
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email

      resourceserver:
        jwt:
          issuer-uri: http://192.168.163.218:8080/realms/bzhcamp
